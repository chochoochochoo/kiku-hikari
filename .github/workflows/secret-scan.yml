# 手元の hook を入れ忘れたクローンから push されても、GitHub 側で全履歴を検査する（3層目）
name: secret-scan
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/secret_scan.py --history
